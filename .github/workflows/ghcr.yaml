name: Publish container images

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/ghcr.yaml
      - containers/core/**
      - containers/hermes/**
      - containers/codium/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Core image name
        id: image
        run: printf 'name=ghcr.io/%s/core\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Core
        id: build
        uses: docker/build-push-action@v7
        with:
          context: containers/core
          file: containers/core/Containerfile
          pull: true
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core

  derived:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [hermes, codium]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: printf 'name=ghcr.io/%s/%s\n' "${GITHUB_REPOSITORY_OWNER,,}" "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.image }}
          file: containers/${{ matrix.image }}/Containerfile
          pull: true
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: CORE_IMAGE=${{ needs.core.outputs.image }}@${{ needs.core.outputs.digest }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
