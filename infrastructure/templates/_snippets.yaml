{{ define "pod.securityContext" }}
{{ if eq .Values.environment "podman" }}
securityContext:
  fsGroup: 0
  fsGroupChangePolicy: "OnRootMismatch"
  runAsGroup: 0
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault
{{ end }}
{{ end }}

{{ define "pod.hostAliases" }}
{{ if eq .Values.environment "podman" }}
hostAliases:
  - ip: "172.18.80.1"
    hostnames:
      - "windows.host"
{{ end }}
{{ end }}

{{ define "container.securityContext" }}
{{ if eq .Values.environment "podman" }}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  privileged: false
  readOnlyRootFilesystem: false
  runAsGroup: 0
  runAsNonRoot: true  
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault
{{ end }}
{{ end }}